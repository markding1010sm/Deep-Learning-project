[project]
name = "goemotions-project"
version = "0.1.0"
description = "Fine grained emotion classification with a neural baseline and DistilBERT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "streamlit>=1.39",
    "torch>=2.4",
    "transformers>=4.45",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# NVIDIA GPU users: this pins torch to the CUDA 12.8 build so training uses
# the GPU. If `uv run python -c "import torch; print(torch.cuda.is_available())"`
# prints False on your machine, pick the index matching your driver from
# https://pytorch.org/get-started/locally/, swap the URL below, then run
# `uv lock && uv sync --dev` again. CPU-only machines can remove this block.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
